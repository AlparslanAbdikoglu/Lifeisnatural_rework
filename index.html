<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life is Natural – CBD kávék</title>
  <meta name="description" content="Life is Natural – CBD-vel dúsított kávékapszulák, testnek és léleknek." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Life is Natural – CBD testnek és léleknek" />
  <meta property="og:description" content="CBD-vel dúsított, Nespresso kompatibilis kávékapszulák." />
  <meta property="og:image" content="04.webp" />
  <link rel="icon" href="favicon.ico" />
  <style>
    :root { --green:#16a34a; --green-dark:#15803d; --green-bg:#f0fdf4; --text:#1f2937; --muted:#4b5563; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--text); line-height:1.6; background:#fff; }
    .wrap { max-width:1000px; margin:0 auto; padding:0 20px; }
    header { position:sticky; top:0; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.08); z-index:10; }
    header .wrap { display:flex; align-items:center; justify-content:space-between; height:60px; }
    .logo { font-size:1.4rem; font-weight:700; color:var(--green); text-decoration:none; }
    .lang button { background:none; border:1px solid #d1d5db; border-radius:6px; padding:4px 10px; cursor:pointer; font-size:.9rem; }
    .lang button[aria-pressed="true"] { background:var(--green); color:#fff; border-color:var(--green); }
    .hero { background:linear-gradient(to right,#f0fdf4,#dcfce7); padding:72px 0; }
    .hero .wrap { display:grid; grid-template-columns:1fr 1fr; gap:32px; align-items:center; }
    h1 { font-size:2.6rem; line-height:1.15; color:var(--green); margin-bottom:16px; }
    .hero p { font-size:1.1rem; color:var(--muted); margin-bottom:24px; }
    .btn { display:inline-block; background:var(--green); color:#fff; padding:12px 28px; border-radius:8px; text-decoration:none; font-weight:600; }
    .btn:hover { background:var(--green-dark); }
    .hero img { width:100%; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.15); }
    section { padding:56px 0; }
    h2 { font-size:1.8rem; margin-bottom:24px; text-align:center; }
    .products { display:grid; grid-template-columns:repeat(2,1fr); gap:24px; }
    .card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.06); }
    .card img { width:100%; height:220px; object-fit:cover; display:block; }
    .card div { padding:16px; }
    .card h3 { margin-bottom:8px; }
    .card p { font-size:.9rem; color:var(--muted); }
    .about { background:var(--green-bg); }
    .about .wrap { max-width:760px; text-align:center; }
    .about p { color:var(--muted); margin-bottom:16px; }
    .contact { text-align:center; }
    footer { background:#111827; color:#d1d5db; text-align:center; padding:28px 20px; font-size:.9rem; }
    footer a, .contact a:not(.btn) { color:inherit; }
    @media (max-width:700px) {
      .hero .wrap, .products { grid-template-columns:1fr; }
      h1 { font-size:2rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="logo" href="#">Life is Natural</a>
      <div class="lang">
        <button type="button" data-lang="hu" aria-pressed="true">HU</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <div class="hero">
    <div class="wrap">
      <div>
        <h1 data-i18n="hero_title"></h1>
        <p data-i18n="hero_desc"></p>
        <a class="btn" href="#contact" data-i18n="hero_cta"></a>
      </div>
      <img src="04.webp" alt="Life is Natural CBD kávékapszula" />
    </div>
  </div>

  <section>
    <div class="wrap">
      <h2 data-i18n="products_title"></h2>
      <div class="products">
        <div class="card">
          <img src="04.webp" alt="" />
          <div>
            <h3 data-i18n="p1_name"></h3>
            <p data-i18n="p_desc"></p>
          </div>
        </div>
        <div class="card">
          <img src="04.webp" alt="" />
          <div>
            <h3 data-i18n="p2_name"></h3>
            <p data-i18n="p_desc"></p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="about">
    <div class="wrap">
      <h2 data-i18n="cbd_title"></h2>
      <p data-i18n="cbd_1"></p>
      <p data-i18n="cbd_2"></p>
      <p data-i18n="cbd_3"></p>
    </div>
  </section>

  <section class="contact" id="contact">
    <div class="wrap">
      <h2 data-i18n="contact_title"></h2>
      <p data-i18n="contact_desc"></p>
      <p style="margin:20px 0"><a class="btn" href="mailto:support@lifeisnatural.eu">support@lifeisnatural.eu</a></p>
      <p><a href="tel:+36205085448">+36 20 508 5448</a></p>
      <address style="font-style:normal">Pozsonyi út 30, 1137 Budapest, Magyarország</address>
    </div>
  </section>

  <footer>
    <p data-i18n="rights"></p>
  </footer>

  <script>
    var T = {
      hu: {
        hero_title: "CBD-vel dúsított kávé, testnek és léleknek",
        hero_desc: "Gondosan válogatott CBD-vel dúsított kávékapszuláink Nespresso kompatibilisek. Találja meg a tökéletes terméket életstílusához.",
        hero_cta: "Kapcsolat",
        products_title: "Termékeink",
        p1_name: "CBD Ezüstkolloid kávé kapszula",
        p2_name: "CBD Arany kávé kapszula",
        p_desc: "1 doboz 10 kapszula. CBD tartalom: 3,36 mg. Kávé származása: Costa Rica. Összetevők: őrölt pörkölt kávé (80% arabica és 20% robusta) és CBD olaj 5%-os oldatban. Nespresso kompatibilis kapszulában.",
        cbd_title: "Mi a CBD? Hogyan működik? Mire jó?",
        cbd_1: "A CBD vagy kannabidiol a kannabisz növényből származik. Ez az a növény, amely a sokat emlegetett pszichoaktív THC-t is tartalmazza.",
        cbd_2: "A CBD olaj azonban kevesebb mint 0,2% THC-t tartalmaz, vagy egyáltalán nem tartalmaz THC-t. Általában más olajokkal, például kendermagolajjal keverik.",
        cbd_3: "Nem pszichoaktív és nem okoz függőséget, de a fogyasztók számos jelentés szerint pozitív előnyökről számolnak be.",
        contact_title: "Kapcsolat",
        contact_desc: "Kérdése van? Írjon nekünk e-mailben.",
        rights: "© 2025 Life is Natural. Minden jog fenntartva."
      },
      en: {
        hero_title: "CBD-infused coffee for body and soul",
        hero_desc: "Our carefully selected CBD-infused coffee capsules are Nespresso compatible. Find the perfect product for your lifestyle.",
        hero_cta: "Contact us",
        products_title: "Our products",
        p1_name: "CBD Silver Colloid coffee capsule",
        p2_name: "CBD Gold coffee capsule",
        p_desc: "1 box of 10 capsules. CBD content: 3.36 mg. Coffee origin: Costa Rica. Ingredients: ground roasted coffee (80% arabica, 20% robusta) and CBD oil in 5% solution. In Nespresso compatible capsules.",
        cbd_title: "What is CBD? How does it work? What is it good for?",
        cbd_1: "CBD, or cannabidiol, comes from the cannabis plant, the same plant that contains the well-known psychoactive THC.",
        cbd_2: "CBD oil, however, contains less than 0.2% THC or none at all. It is usually blended with other oils, such as hemp seed oil.",
        cbd_3: "It is non-psychoactive and non-addictive, and many users report positive benefits.",
        contact_title: "Contact",
        contact_desc: "Questions? Send us an email.",
        rights: "© 2025 Life is Natural. All rights reserved."
      }
    };
    function setLang(l) {
      document.documentElement.lang = l;
      document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = T[l][el.dataset.i18n]; });
      document.querySelectorAll("[data-lang]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.lang === l)); });
      try { localStorage.setItem("lang", l); } catch (e) {}
    }
    document.querySelectorAll("[data-lang]").forEach(function (b) { b.addEventListener("click", function () { setLang(b.dataset.lang); }); });
    var saved = "hu";
    try { saved = localStorage.getItem("lang") || "hu"; } catch (e) {}
    setLang(T[saved] ? saved : "hu");
  </script>
</body>
</html>
